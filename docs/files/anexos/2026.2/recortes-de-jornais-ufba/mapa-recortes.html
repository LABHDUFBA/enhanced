function renderPopup(idx) {
    var d = MAP_DATA[idx];
    if (!d) return '<div>Erro: dados não encontrados</div>';

    var names = d.names.slice(0, 3).join(', ');
    if (d.names.length > 3) names += ' (+' + (d.names.length - 3) + ' outros)';

    var html = '<div style="font-family: Arial, sans-serif; min-width: 280px; max-width: 380px;">';
    html += '<h4 style="margin: 0 0 5px 0; color: #333;">' + escapeHtml(names) + '</h4>';
    html += '<p style="margin: 2px 0; font-size: 12px; color: #666;">';
    html += '<b>' + d.count + '</b> menções noticiosas (' + d.mentions.length + ' trechos únicos)<br>';
    html += 'Jornais: ' + escapeHtml(d.periodicos.slice(0, 5).join(', '));
    if (d.display) html += '<br><span style="font-size: 10px; color: #999;">' + escapeHtml(d.display) + '</span>';
    html += '</p>';
    html += '<hr style="margin: 5px 0;">';

    if (d.mentions.length === 0) {
        html += '<p style="font-size: 11px; color: #888;">Sem trechos disponíveis.</p>';
    } else {
        html += '<div style="font-size: 11px; color: #444; max-height: 350px; overflow-y: auto; padding-right: 5px;">';
        for (var j = 0; j < d.mentions.length; j++) {
            var m = d.mentions[j];
            html += '<div style="margin: 3px 0; padding: 4px; background: #f5f5f5; border-radius: 3px;">';
            html += '<i style="color: #888; font-size: 10px;">' + escapeHtml(m.periodico || '') + ' — ' + escapeHtml(m.data || '') + '</i><br>';
            html += escapeHtml(m.text);
            html += '</div>';
        }
        html += '</div>';
    }

    html += '</div>';
    return html;
}

function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
}

// Intercept popup open events to inject content
document.addEventListener('DOMContentLoaded', function() {
    // Find the map
    var mapObj = null;
    for (var k in window) {
        try {
            if (window[k] instanceof L.Map) { mapObj = window[k]; break; }
        } catch(e) {}
    }

    if (mapObj) {
        mapObj.on('popupopen', function(e) {
            var popup = e.popup;
            var content = popup.getContent();
            if (!content) return;
            // Convert to string if it's an element
            var contentStr = typeof content === 'string' ? content : '';
            if (!contentStr && content instanceof HTMLElement) {
                contentStr = content.innerHTML;
            }
            if (!contentStr) return;
            // Check if it's our placeholder
            var match = contentStr.match(/popup-(\d+)/);
            if (match) {
                var idx = parseInt(match[1]);
                var html = renderPopup(idx);
                popup.setContent(html);
                popup.update();
            }
        });
    }
});

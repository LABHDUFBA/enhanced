project:
  type: website
  output-dir: docs
  resources:
    - i18n/*.json
    - i18n/*.js
    - i18n/*.css
    - files/docs/*
    - files/images/*
    - files/anexos/**

# Meta
description-meta: "Enhanced — Digital Humanities and Artificial Intelligence. Blog do LABHDUFBA."
author-meta: "LABHDUFBA"

website:
  title: "Enhanced"
  image: "files/images/og-enhanced.jpg"
  description: "Digital Humanities and Artificial Intelligence — LABHDUFBA"

  navbar:
    background: dark

    left:
      - text: Sobre
        menu:
          - text: Apresentação
            href: sobre.qmd
          - text: Corpo Editorial
            href: corpo-editorial.qmd
          - text: Normas
            href: normas.qmd
          - text: Contato
            href: contato.qmd
      - text: Edições
        href: edicoes.qmd
      - text: Textos
        href: textos.qmd

    right:
      - icon: github
        href: https://github.com/labhdufba
        target: _blank
      - icon: twitter
        href: https://x.com/labhdufba
        target: _blank
      - icon: instagram
        href: https://instagram.com/labhdufba
        target: _blank

  page-navigation: true

  page-footer:
    left: "Enhanced &copy; <script>document.write(new Date().getFullYear())</script> · LABHDUFBA"
    center: "<a href=\"https://labhd.ufba.br\"><img src=\"https://enhanced.inovahd.org/files/images/labhd-logo.webp\" alt=\"LABHDUFBA\" style=\"height:2.25rem; vertical-align:middle; opacity:0.78;\"></a>"
    right:
      - icon: github
        href: https://github.com/labhdufba
        target: _blank

  search:
    location: navbar
    type: textbox

  draft-mode: unlinked

  open-graph: true

  twitter-card: true

  site-url: "https://enhanced.inovahd.org"
  favicon: "files/images/favicon.svg"

format:
  html:
    theme: cosmo
    css: styles-v2.css
    toc: true
    footnotes-hover: true
    email-obfuscation: javascript
    link-external-newwindow: true
    lang: en
    include-in-header: "files/includes/_i18n.html"